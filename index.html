<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control Financiero</title>
    <style>
        :root { --bg: #121212; --card-bg: #1e1e1e; --text: #e0e0e0; --primary: #bb86fc; --success: #03dac6; --danger: #cf6679; --border: #333; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; padding-bottom: 70px; }
        
        .header { background: var(--card-bg); padding: 20px; text-align: center; font-size: 1.2rem; font-weight: bold; border-bottom: 1px solid var(--border); }
        
        /* Dashboard Grid */
        .dashboard-main { background: linear-gradient(135deg, #2c2c2c, #1a1a1a); padding: 25px 20px; text-align: center; border-bottom: 1px solid var(--border); }
        .net-worth { font-size: 2.5rem; font-weight: bold; color: var(--success); margin-top: 10px; }
        
        .grid-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; }
        .card { background: var(--card-bg); padding: 15px; border-radius: 12px; text-align: center; border: 1px solid var(--border); }
        .card-title { font-size: 0.85rem; color: #aaa; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .card-value { font-size: 1.3rem; font-weight: bold; }
        .val-liq { color: #82b1ff; } .val-inv { color: #b388ff; } .val-deuda { color: var(--danger); }
        
        .projection-box { background: var(--card-bg); margin: 0 20px 20px 20px; padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
        .proj-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); }
        .proj-item:last-child { border-bottom: none; }

        /* Formularios */
        .tab-content { display: none; padding: 20px; max-width: 500px; margin: auto; }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.9rem; margin-bottom: 8px; color: #bbb; }
        input, select { width: 100%; padding: 14px; background: #2c2c2c; border: 1px solid var(--border); border-radius: 8px; color: white; font-size: 1rem; box-sizing: border-box; }
        input:focus, select:focus { outline: none; border-color: var(--primary); }
        
        button { width: 100%; padding: 16px; background-color: var(--primary); color: #000; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button.action-btn { background-color: var(--card-bg); color: var(--text); border: 1px solid var(--primary); }
        
        /* Bottom Navigation */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: var(--card-bg); display: flex; border-top: 1px solid var(--border); }
        .nav-item { flex: 1; padding: 15px 0; text-align: center; color: #888; font-size: 0.8rem; cursor: pointer; }
        .nav-item.active { color: var(--primary); font-weight: bold; border-top: 3px solid var(--primary); }
        
        .loader { border: 4px solid #333; border-top: 4px solid var(--primary); border-radius: 50%; width: 25px; height: 25px; animation: spin 1s linear infinite; margin: auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="header">Control Financiero</div>

    <!-- PESTAÑA: BALANCE (Dashboard) -->
    <div id="inicio" class="tab-content active" style="padding: 0; max-width: 100%;">
        <div class="dashboard-main">
            <div style="color: #aaa; font-size: 0.9rem; text-transform: uppercase;">Patrimonio Neto Total</div>
            <div id="loaderResumen" class="loader" style="display: block; margin-top: 15px;"></div>
            <div class="net-worth" id="lblNeto">...</div>
        </div>
        
        <div class="grid-cards">
            <div class="card"><div class="card-title">Caja (Liquidez)</div><div class="card-value val-liq" id="lblLiq">$ 0</div></div>
            <div class="card"><div class="card-title">Inversiones</div><div class="card-value val-inv" id="lblInv">$ 0</div></div>
            <div class="card" style="grid-column: span 2;"><div class="card-title">Deuda Tarjeta (Mes Actual)</div><div class="card-value val-deuda" id="lblDeuda">$ 0</div></div>
        </div>

        <div class="projection-box">
            <h3 style="margin-top: 0; color: #eee; font-size: 1.1rem; text-align: center;">Proyección de Cuotas Futuras</h3>
            <div id="listaProyeccion"><p style="color: #888; text-align: center;">Calculando...</p></div>
        </div>
    </div>

    <!-- PESTAÑA: INGRESOS Y TARJETA -->
    <div id="gastos" class="tab-content">
        <div class="projection-box" style="margin: 0 0 20px 0; text-align: center;">
            <h4 style="margin-top: 0; color: var(--primary);">🤖 Lector IA de Comprobantes</h4>
            <input type="file" id="archivoResumen" accept="application/pdf,image/*" style="margin-bottom: 15px;">
            <button class="action-btn" id="btnSubirArchivo" onclick="procesarArchivo()">Extraer Gastos Mágicamente</button>
        </div>

        <h4 style="text-align: center; border-bottom: 1px solid var(--border); padding-bottom: 10px;">Carga Manual</h4>
        <form id="formGasto" onsubmit="enviarDatos(event, 'gasto', 'formGasto')">
            <div class="form-group"><label>Categoría</label><select id="g_categoria"><option value="General">General / Compras</option><option value="Suscripción">Suscripción</option><option value="Servicio">Servicio Adherido</option></select></div>
            <div class="form-group"><label>Fecha</label><input type="date" id="g_fecha" required></div>
            <div class="form-group"><label>Comercio</label><input type="text" id="g_comercio" required></div>
            <div class="form-group"><label>Tarjeta</label><select id="g_tarjeta"><option value="Visa 7431">Visa 7431</option><option value="Mastercard">Mastercard</option></select></div>
            <div class="form-group"><label>Monto Total ($)</label><input type="number" id="g_montoTotal" step="0.01" required></div>
            <div class="form-group"><label>Cuotas</label><input type="number" id="g_cuotas" value="1" min="1" required></div>
            <button type="submit">Guardar Gasto</button>
        </form>
    </div>

    <!-- PESTAÑA: INVERSIONES -->
    <div id="inversiones" class="tab-content">
        <h3 style="text-align: center;">Actualizar Posición</h3>
        <form id="formInversion" onsubmit="enviarDatos(event, 'inversion', 'formInversion')">
            <div class="form-group"><label>Plataforma</label><select id="i_plataforma"><option value="Mercado Pago">Mercado Pago</option><option value="Cocos Capital">Cocos Capital</option><option value="Ripio">Ripio</option><option value="Lemon">Lemon</option></select></div>
            <div class="form-group"><label>Ticker (Ej: ARS, BTC)</label><input type="text" id="i_ticker" required></div>
            <div class="form-group"><label>Cantidad / Nominales</label><input type="number" id="i_monto" step="0.000001" required></div>
            <div class="form-group"><label>Total Pesos Estimado ($)</label><input type="number" id="i_totalPesos" step="0.01" required></div>
            <button type="submit">Actualizar Inversión</button>
        </form>
    </div>

    <!-- PESTAÑA: CAJA -->
    <div id="caja" class="tab-content">
        <h3 style="text-align: center;">Movimientos de Liquidez</h3>
        <form id="formCaja" onsubmit="enviarDatos(event, 'caja', 'formCaja')">
            <div class="form-group"><label>Concepto</label><input type="text" id="c_concepto" required></div>
            <div class="form-group"><label>Tipo</label><select id="c_tipo"><option value="Ingreso">Ingreso</option><option value="Egreso">Egreso</option></select></div>
            <div class="form-group"><label>Monto Movimiento ($)</label><input type="number" id="c_monto" step="0.01" required></div>
            <div class="form-group"><label>Saldo Resultante ($)</label><input type="number" id="c_saldo" step="0.01" required></div>
            <button type="submit">Registrar Caja</button>
        </form>
    </div>

    <!-- Menú de Navegación Inferior -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="showTab('inicio', this)">📊<br>Balance</div>
        <div class="nav-item" onclick="showTab('gastos', this)">💳<br>Gastos</div>
        <div class="nav-item" onclick="showTab('inversiones', this)">📈<br>Inversiones</div>
        <div class="nav-item" onclick="showTab('caja', this)">🏦<br>Caja</div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwH6tBlY-HS39WZWw4rEbJbYclirYKorcec4DLT0Ga_vlKAQbiqo_NfPZK1IR5-TuKe/exec';

        function showTab(tabId, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            el.classList.add('active');
            if(tabId === 'inicio') cargarDashboard();
        }

        window.onload = function() {
            document.getElementById('g_fecha').valueAsDate = new Date();
            cargarDashboard();
        };

        const formatearPesos = (num) => '$ ' + num.toLocaleString('es-AR', {minimumFractionDigits: 0, maximumFractionDigits: 0});

        function cargarDashboard() {
            document.getElementById('loaderResumen').style.display = 'block';
            document.getElementById('lblNeto').innerText = '';
            
            fetch(scriptURL)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('loaderResumen').style.display = 'none';
                    document.getElementById('lblNeto').innerText = formatearPesos(data.patrimonioNeto);
                    document.getElementById('lblLiq').innerText = formatearPesos(data.liquidez);
                    document.getElementById('lblInv').innerText = formatearPesos(data.inversiones);
                    document.getElementById('lblDeuda').innerText = formatearPesos(data.deudaTarjeta);
                    
                    let htmlProj = '';
                    if(data.proyeccion.length === 0) {
                        htmlProj = '<p style="text-align:center; color:#888;">No hay cuotas pendientes</p>';
                    } else {
                        data.proyeccion.forEach(p => {
                            htmlProj += `<div class="proj-item"><span style="color:#bbb">${p.mes}</span><strong style="color:var(--danger)">${formatearPesos(p.monto)}</strong></div>`;
                        });
                    }
                    document.getElementById('listaProyeccion').innerHTML = htmlProj;
                }).catch(err => {
                    document.getElementById('loaderResumen').style.display = 'none';
                    document.getElementById('lblNeto').innerText = 'Error';
                });
        }

        function enviarDatos(e, tipo, formId) {
            e.preventDefault();
            const btn = document.querySelector(`#${formId} button`);
            const btnText = btn.innerText; btn.innerText = "Guardando..."; btn.disabled = true;

            let datos = { tipoRegistro: tipo };
            if (tipo === 'gasto') {
                datos.categoria = document.getElementById('g_categoria').value; datos.fecha = document.getElementById('g_fecha').value;
                datos.comercio = document.getElementById('g_comercio').value; datos.tarjeta = document.getElementById('g_tarjeta').value;
                datos.montoTotal = parseFloat(document.getElementById('g_montoTotal').value); datos.cuotasTotales = parseInt(document.getElementById('g_cuotas').value);
            } else if (tipo === 'inversion') {
                datos.plataforma = document.getElementById('i_plataforma').value; datos.monedaTicker = document.getElementById('i_ticker').value;
                datos.monto = parseFloat(document.getElementById('i_monto').value); datos.totalPesos = parseFloat(document.getElementById('i_totalPesos').value);
            } else if (tipo === 'caja') {
                datos.concepto = document.getElementById('c_concepto').value; datos.tipoMovimiento = document.getElementById('c_tipo').value;
                datos.monto = parseFloat(document.getElementById('c_monto').value); datos.saldoResultante = parseFloat(document.getElementById('c_saldo').value);
            }

            fetch(scriptURL, { method: 'POST', body: JSON.stringify(datos), headers: { 'Content-Type': 'text/plain;charset=utf-8' } })
            .then(res => res.json()).then(data => {
                alert("¡Guardado exitoso!"); document.getElementById(formId).reset();
            }).finally(() => { btn.innerText = btnText; btn.disabled = false; });
        }

        function procesarArchivo() {
            const fileInput = document.getElementById('archivoResumen');
            if (fileInput.files.length === 0) { alert("Por favor seleccioná un archivo primero."); return; }
            const btn = document.getElementById('btnSubirArchivo'); btn.innerText = "Analizando...⏳"; btn.disabled = true;

            const reader = new FileReader();
            reader.onload = function(e) {
                const payload = { tipoRegistro: "upload_resumen", archivoBase64: e.target.result.split(',')[1], mimeType: fileInput.files[0].type };
                fetch(scriptURL, { method: 'POST', body: JSON.stringify(payload), headers: { 'Content-Type': 'text/plain;charset=utf-8' } })
                .then(res => res.json()).then(data => { alert(data.mensaje || "¡Procesado!"); })
                .finally(() => { btn.innerText = "Extraer Gastos Mágicamente"; btn.disabled = false; fileInput.value = ""; });
            };
            reader.readAsDataURL(fileInput.files[0]);
        }
    </script>
</body>
</html>
